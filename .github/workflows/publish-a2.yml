name: Alpha A2 Release Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/a2-publish.trigger"
  workflow_run:
    workflows:
      - Alpha OS Image Final
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Validated Alpha OS source commit
        required: true
        type: string
      os_run_id:
        description: Successful Alpha OS Image Final run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish verified A2 split ISO
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve publication target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_SHA: ${{ inputs.target_sha }}
          DISPATCH_RUN_ID: ${{ inputs.os_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)
              TARGET_SHA="$WORKFLOW_RUN_SHA"
              OS_RUN_ID="$WORKFLOW_RUN_ID"
              ;;
            workflow_dispatch)
              TARGET_SHA="$DISPATCH_SHA"
              OS_RUN_ID="$DISPATCH_RUN_ID"
              ;;
            push)
              TARGET_SHA="$PUSH_BEFORE_SHA"
              OS_RUN_ID="$(gh api --paginate "/repos/$REPOSITORY/actions/workflows/372212179/runs?branch=main&head_sha=$TARGET_SHA&status=success&per_page=100"                 --jq '.workflow_runs[] | select(.workflow_id == 372212179 and .status == "completed" and .conclusion == "success") | .id'                 | head -n 1 || true)"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          test -n "$TARGET_SHA"
          test -n "$OS_RUN_ID"

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "os_run_id=$OS_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}

      - name: Resolve verified source runs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          OS_RUN_ID: ${{ steps.target.outputs.os_run_id }}
        run: |
          set -euo pipefail
          echo "Target source SHA: $TARGET_SHA"

          gh api "/repos/$REPOSITORY/actions/runs/$OS_RUN_ID"             --jq 'select(.status=="completed" and .conclusion=="success" and .head_sha=="'"$TARGET_SHA"'") | .id'             | grep -qx "$OS_RUN_ID"

          CI_READY="$(gh api --paginate "/repos/$REPOSITORY/actions/runs?branch=main&per_page=100"             --jq '.workflow_runs[] | select(.workflow_id == 367314749 and .head_sha == "'"$TARGET_SHA"'" and .status == "completed" and .conclusion == "success") | .id'             | head -n 1 || true)"
          test -n "$CI_READY"

          COUNT="$(gh api "/repos/$REPOSITORY/actions/runs/$OS_RUN_ID/artifacts" --jq '.total_count')"
          test "$COUNT" -ge 6

          echo "run_id=$OS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_READY" >> "$GITHUB_OUTPUT"

      - name: Download verified A2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alpha-linux-0.1.0a2-alpha-amd64-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify split ISO assets
        run: |
          set -euo pipefail
          find release-assets -type f -print
          for f in             alpha-linux-0.1.0a2-alpha-amd64.iso.part-01             alpha-linux-0.1.0a2-alpha-amd64.iso.part-02             alpha-linux-0.1.0a2-alpha-amd64.iso.part-03             alpha-linux-0.1.0a2-alpha-amd64.iso.part-04             alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256             alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json             REASSEMBLE-ISO.txt; do
            test -n "$(find release-assets -type f -name "$f" -print -quit)"
          done

      - name: Publish A2 release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: bash scripts/publish-a2.sh
