name: Alpha A2 Release Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/a2-publish.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish verified A2 split ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve verified A2 OS image run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Target source SHA: $TARGET_SHA"
          OS_READY=""
          CI_READY=""
          for attempt in $(seq 1 60); do
            OS_READY="$(gh api "/repos/$REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name==".github/workflows/alpha-os-image-final.yml" and .head_sha=="'"$TARGET_SHA"'") | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1 || true)"
            CI_READY="$(gh api "/repos/$REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name=="Alpha Linux CI/CD" and .head_sha=="'"$TARGET_SHA"'") | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1 || true)"
            if [[ -n "$OS_READY" && -n "$CI_READY" ]]; then break; fi
            echo "Waiting for verified dependencies: OS='$OS_READY' CI='$CI_READY' (attempt $attempt/60)"
            sleep 30
          done
          test -n "$OS_READY"
          test -n "$CI_READY"
          RUN_ID=""
          for candidate in $OS_READY; do
            count="$(gh api "/repos/$REPOSITORY/actions/runs/$candidate/artifacts" --jq '.total_count' 2>/dev/null || echo 0)"
            if [[ "$count" -ge 6 ]]; then RUN_ID="$candidate"; break; fi
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected verified OS artifact run: $RUN_ID"

      - name: Download verified A2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alpha-linux-0.1.0a2-alpha-amd64-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify split ISO assets are complete
        run: |
          set -euo pipefail
          test -s release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01
          test -s release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02
          test -s release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256
          test -s release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json
          test -s release-assets/REASSEMBLE-ISO.txt

      - name: Publish A2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-a2.sh
