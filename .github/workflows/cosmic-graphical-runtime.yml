name: Alpha COSMIC Graphical Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cosmic-graphical-runtime.yml"
      - ".github/workflows/os-image.yml"
      - "scripts/build_alpha_os_image.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  graphical-runtime:
    name: Verify COSMIC graphical runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Resolve exact Alpha OS Image gate for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          API="/repos/${GITHUB_REPOSITORY}/actions/workflows/os-image.yml/runs"
          RUN_ID=""
          STATUS=""
          CONCLUSION=""

          for attempt in $(seq 1 360); do
            RUN_JSON="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow os-image.yml               --commit "$HEAD_SHA"               --limit 20               --json databaseId,status,conclusion,headSha,event               | jq '[.[] | select(.headSha == "'"$HEAD_SHA"'" and .event == "pull_request")] | sort_by(.databaseId) | reverse | .[0] // empty')"

            if [ -n "$RUN_JSON" ]; then
              RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r '.databaseId')"
              STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"
              echo "Alpha OS Image exact gate: run=$RUN_ID head_sha=$HEAD_SHA status=$STATUS conclusion=$CONCLUSION"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" != "success" ]; then
                  echo "Alpha OS Image gate failed for exact HEAD_SHA $HEAD_SHA."
                  exit 1
                fi
                break
              fi
            else
              echo "Waiting for Alpha OS Image run for exact HEAD_SHA $HEAD_SHA..."
            fi

            sleep 15
          done

          test -n "$RUN_ID"
          test "$STATUS" = "completed"
          test "$CONCLUSION" = "success"
          echo "ALPHA_OS_IMAGE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact graphical runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          gh run download "${ALPHA_OS_IMAGE_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name alpha-linux-0.1.0a1-alpha-amd64-evidence             --dir dist/evidence
          test -n "$(find dist/evidence -type f -name 'cosmic-graphical-runtime-boot.log' -print -quit)"

      - name: Verify explicit COSMIC graphical runtime evidence
        run: |
          set -euo pipefail
          LOG="$(find dist/evidence -type f -name 'cosmic-graphical-runtime-boot.log' -print -quit)"
          echo "Evidence log: ${LOG}"
          grep -Fq "ALPHA_COSMIC_GRAPHICAL_RUNTIME=PASS" "${LOG}"
          grep -Fq "cosmic_comp=" "${LOG}"
          grep -Fq "wayland_socket=" "${LOG}"
          echo "COSMIC graphical runtime evidence: PASS"
