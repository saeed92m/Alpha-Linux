name: Alpha COSMIC Graphical Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cosmic-graphical-runtime.yml"
      - ".github/workflows/os-image.yml"
      - "scripts/build_alpha_os_image.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  graphical-runtime:
    name: Verify COSMIC graphical runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Wait for Alpha OS Image gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 240); do
            RUN_ID="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&per_page=100"               --jq '.workflow_runs[] | select(.workflow_id == 367943227 and .head_sha == "'"$HEAD_SHA"'" ) | [.id,.status,.conclusion] | @tsv'               | head -n 1 | cut -f1 || true)"
            if [ -n "$RUN_ID" ]; then
              STATUS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
              CONCLUSION="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // empty')"
              echo "Alpha OS Image run=$RUN_ID status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] || { echo "Alpha OS Image gate failed."; exit 1; }
                break
              fi
            fi
            sleep 15
          done
          test -n "$RUN_ID"
          echo "ALPHA_OS_IMAGE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download graphical runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          gh run download "$ALPHA_OS_IMAGE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name alpha-linux-0.1.0a1-alpha-amd64-evidence             --dir dist/evidence
          test -n "$(find dist/evidence -type f -name 'cosmic-graphical-runtime-boot.log' -print -quit)"

      - name: Verify explicit COSMIC graphical runtime evidence
        run: |
          set -euo pipefail
          LOG="$(find dist/evidence -type f -name 'cosmic-graphical-runtime-boot.log' -print -quit)"
          echo "Evidence log: $LOG"
          grep -Fq "ALPHA_COSMIC_GRAPHICAL_RUNTIME=PASS" "$LOG"
          grep -Fq "cosmic_comp=" "$LOG"
          grep -Fq "wayland_socket=" "$LOG"
          echo "COSMIC graphical runtime evidence: PASS"
