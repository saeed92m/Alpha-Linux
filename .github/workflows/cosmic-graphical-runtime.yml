name: Alpha COSMIC Graphical Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cosmic-graphical-runtime.yml"
      - ".github/workflows/os-image.yml"
      - "scripts/build_alpha_os_image.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-cosmic-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graphical-runtime:
    name: Verify canonical COSMIC graphical-runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify canonical executable COSMIC runtime gate
        run: |
          set -euo pipefail

          workflow=".github/workflows/os-image.yml"
          script="scripts/build_alpha_os_image.sh"

          test -s "$workflow"
          test -s "$script"

          grep -Fq 'name: Alpha OS Image' "$workflow"
          grep -Fq 'Run automated COSMIC graphical session runtime validation' "$workflow"
          grep -Fq 'ALPHA_COSMIC_GRAPHICAL_RUNTIME=PASS' "$workflow"
          grep -Fq 'layerfs-path=minimal.standard.live.squashfs' "$workflow"
          grep -Fq -- '-vga virtio' "$workflow"

          grep -Fq 'alpha-cosmic-validation.target' "$script"
          grep -Fq 'alpha-cosmic-graphical-runtime.service' "$script"
          grep -Fq 'alpha-cosmic-graphical-runtime-check' "$script"
          grep -Fq 'ALPHA_COSMIC_GRAPHICAL_RUNTIME=PASS' "$script"
          grep -Fq 'XDG_SESSION_TYPE=wayland' "$script"
          grep -Fq 'XDG_CURRENT_DESKTOP=COSMIC' "$script"
          grep -Fq 'wayland-' "$script"

          echo "Canonical executable COSMIC graphical-runtime gate is present."
          echo "The actual ISO/QEMU runtime validation is executed exactly once by Alpha OS Image."
