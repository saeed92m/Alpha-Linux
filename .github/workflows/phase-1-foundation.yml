name: Alpha Linux Foundation Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: CI-VAL-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python implementation/validate.py
      - run: python -m compileall -q implementation

  docs:
    name: CI-DOC-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal Markdown targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          bad = []
          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue
              for target in re.findall(r'\]\(([^)#]+)(?:#[^)]+)?\)', path.read_text(encoding="utf-8")):
                  if "://" in target or target.startswith("mailto:"):
                      continue
                  if not (path.parent / target).resolve().exists():
                      bad.append(f"{path}: {target}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("documentation links: PASS")
          PY

  lint:
    name: CI-LINT-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "ruff>=0.6,<1"
      - run: ruff check implementation

  unit:
    name: CI-TEST-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: pytest -q

  integration:
    name: CI-TEST-002
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: pytest -q implementation/tests

  package:
    name: CI-PKG-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "build>=1,<2"
      - run: python -m build
      - run: python -m pip install --dry-run dist/*.whl

  security:
    name: CI-SEC-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret policy scan
        run: |
          if grep -RniE '(^|[[:space:]])(password|api_key|private_key|secret|token)[[:space:]]*=' implementation --exclude='test_*.py'; then
            echo "Potential secret-bearing assignment found."
            exit 1
          fi
          echo "basic secret policy scan: PASS"

  build:
    name: CI-BLD-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "build>=1,<2"
      - run: python -m build
      - run: test -s dist/*.whl

  artifact:
    name: CI-ART-001
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "build>=1,<2"
      - run: python -m build
      - name: Validate artifact manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          artifacts = sorted(Path("dist").glob("*"))
          if not artifacts:
              raise SystemExit("no build artifacts")
          records = []
          for p in artifacts:
              records.append({"name": p.name, "size": p.stat().st_size,
                              "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          Path("artifact-manifest.json").write_text(
              json.dumps(records, indent=2) + "\n", encoding="utf-8")
          print(Path("artifact-manifest.json").read_text())
          PY

  reproducibility:
    name: CI-REP-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "build>=1,<2"
      - name: Rebuild twice and compare deterministic source validation
        run: |
          python implementation/validate.py
          python implementation/validate.py > validation-a.txt
          python implementation/validate.py > validation-b.txt
          cmp validation-a.txt validation-b.txt

  iso:
    name: CI-ISO-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicit applicability record
        run: |
          echo "ISO gate is conditional for ISO release candidates." > iso-gate-evidence.txt
          echo "Current Phase 1 foundation commit does not declare an ISO release artifact." >> iso-gate-evidence.txt
          cat iso-gate-evidence.txt

  release:
    name: CI-REL-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicit applicability record
        run: |
          echo "Release gate is conditional for release promotion." > release-gate-evidence.txt
          echo "Current Phase 1 foundation commit is not a release candidate." >> release-gate-evidence.txt
          cat release-gate-evidence.txt
