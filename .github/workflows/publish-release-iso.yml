name: Publish Alpha OS Release Assets

on:
  workflow_run:
    workflows: ["Alpha OS Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Publish verified split ISO assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve source OS image run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" && -n "${EVENT_RUN_ID:-}" ]]; then
            echo "run_id=${EVENT_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "workflow_run" && -n "${EVENT_RUN_ID:-}" ]]; then
            echo "run_id=${EVENT_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            for attempt in {1..30}; do
              RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" --workflow os-image.yml --branch main --limit 50 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha=="'"\${CURRENT_SHA}"'") | select(.status=="completed" and .conclusion=="success") | .databaseId' | head -n1 || true)"
              if [[ -n "${RUN_ID}" ]]; then
                echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Waiting for successful Alpha OS Image run for ${CURRENT_SHA} (attempt ${attempt}/30)"
              sleep 20
            done
          fi

          echo "No successful Alpha OS Image run found for ${CURRENT_SHA}" >&2
          exit 1

      - name: Download verified ISO artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          download_artifact() {
            local name="$1"
            local artifact_id
            artifact_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="'"$name"'") | select(.expired==false) | .id' | head -n1)"
            if [[ -z "$artifact_id" ]]; then
              echo "Artifact not found: $name (run $RUN_ID)" >&2
              exit 1
            fi
            echo "Downloading $name (artifact $artifact_id)"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/artifact.zip
            unzip -q /tmp/artifact.zip -d release-assets
            rm -f /tmp/artifact.zip
          }

          download_artifact "alpha-linux-0.1.0a2-alpha-amd64-iso-part-01"
          download_artifact "alpha-linux-0.1.0a2-alpha-amd64-iso-part-02"
          download_artifact "alpha-linux-0.1.0a2-alpha-amd64-iso-part-03"
          download_artifact "alpha-linux-0.1.0a2-alpha-amd64-iso-part-04"
          download_artifact "alpha-linux-0.1.0a2-alpha-amd64-release-metadata"

          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json
          test -f release-assets/REASSEMBLE-ISO.txt

      - name: Upload ISO parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY"             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04             --clobber

      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY"             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json             release-assets/REASSEMBLE-ISO.txt             --clobber

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0a2 -R "$GITHUB_REPOSITORY" --draft=false --prerelease
