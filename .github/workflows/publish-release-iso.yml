name: Publish Alpha OS Release Assets

on:
  workflow_run:
    workflows:
      - "Alpha OS Image Final"
      - ".github/workflows/alpha-os-image-final.yml"
      - "Alpha Linux CI/CD"
    types: [completed]
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.issue.number == 158 && github.event.comment.body == '/publish-a2' && github.event.comment.user.login == 'saeed92m') }}
    name: Publish verified split ISO assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Release dependency gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${EVENT_SHA:-$CURRENT_SHA}"
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            TARGET_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name==".github/workflows/alpha-os-image-final.yml") | select(.status=="completed" and .conclusion=="success") | .head_sha' | head -n 1 || true)"
            if [[ -z "$TARGET_SHA" ]]; then echo "No successful OS image run is available for manual A2 publication." >&2; exit 1; fi
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [[ "${EVENT_NAME}" == "workflow_run" && "${EVENT_CONCLUSION}" != "success" ]]; then
            echo "Triggering workflow ${EVENT_WORKFLOW} did not succeed; release publication is fail-closed."
            exit 1
          fi
          OS_READY="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name==".github/workflows/alpha-os-image-final.yml" and .head_sha=="'"$TARGET_SHA"'") | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1 || true)"
          CI_READY="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name=="Alpha Linux CI/CD" and .head_sha=="'"$TARGET_SHA"'") | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1 || true)"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "OS_READY=$OS_READY"
          echo "CI_READY=$CI_READY"
          if [[ -n "$OS_READY" && -n "$CI_READY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release dependency gate: PASS"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release dependency gate: NOT READY; no wait/retry loop."
          fi

      - name: Resolve source OS image run
        id: source
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${EVENT_SHA:-$CURRENT_SHA}"
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then TARGET_SHA="${{ steps.gate.outputs.target_sha }}"; fi
          if [[ "${EVENT_NAME}" == "workflow_run" && ( "${EVENT_WORKFLOW:-}" == "Alpha OS Image Final" || "${EVENT_WORKFLOW:-}" == ".github/workflows/alpha-os-image-final.yml" ) && -n "${EVENT_RUN_ID:-}" ]]; then
            echo "run_id=${EVENT_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.name==".github/workflows/alpha-os-image-final.yml" and .event=="push" and .head_sha=="'"$TARGET_SHA"'") | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1 || true)"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No successful push-triggered Alpha OS Image run found for ${TARGET_SHA}" >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Ensure A2 release exists and is bound to target SHA
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${{ steps.gate.outputs.target_sha }}"
          if gh release view v0.1.0a2 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if TAG_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0a2" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$TAG_SHA" != "$TARGET_SHA" ]]; then
                echo "Existing draft v0.1.0a2 tag is bound to $TAG_SHA; rebinding it to verified target $TARGET_SHA."
                gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0a2" -f sha="$TARGET_SHA" -F force=true >/dev/null
              fi
              FINAL_TAG_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0a2" --jq '.object.sha')"
              test "$FINAL_TAG_SHA" = "$TARGET_SHA"
            else
              echo "Draft v0.1.0a2 has no tag ref yet; binding its release target to $TARGET_SHA before publication."
              gh release edit v0.1.0a2 -R "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --prerelease
            fi
            echo "A2 draft release is bound to verified target $TARGET_SHA."
          else
            gh release create v0.1.0a2 -R "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "Alpha Linux v0.1.0a2" --notes "Alpha Linux 0.1.0a2 prerelease. Publication is bound to the exact main commit after successful package CI and OS-image evidence gates." --prerelease
            echo "Created v0.1.0a2 bound to $TARGET_SHA."
          fi

      - name: Download verified ISO artifacts
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: alpha-linux-0.1.0a2-alpha-amd64-*
          path: release-assets
          merge-multiple: true

      - name: Validate downloaded release assets
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256
          test -f release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json
          test -f release-assets/REASSEMBLE-ISO.txt
      - name: Upload ISO parts
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY"             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04             --clobber

      - name: Upload release metadata
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY"             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256             release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json             release-assets/REASSEMBLE-ISO.txt             --clobber

      - name: Publish prerelease
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0a2 -R "$GITHUB_REPOSITORY" --target "${{ steps.gate.outputs.target_sha }}" --draft=false --prerelease

# A2 publisher gate hardening: direct Actions API run discovery.
