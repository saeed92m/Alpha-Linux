name: Publish Existing Alpha ISO Release Assets

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish existing ISO without rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Smoke
        run: |
          set -euo pipefail
          echo "publisher smoke"
