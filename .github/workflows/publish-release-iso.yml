name: Publish Alpha OS Release Assets

on:
  workflow_run:
    workflows: ["Alpha OS Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Publish verified split ISO assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve source OS image run
        id: source
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_RUN_ID:-}" ]]; then
            echo "run_id=$EVENT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=36705863927" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ISO part 01
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n alpha-linux-0.1.0a2-alpha-amd64-iso-part-01 -D release-assets
      - name: Upload ISO part 01
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY" release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01 --clobber
      - name: Remove ISO part 01
        run: rm -rf release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-01

      - name: Download ISO part 02
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n alpha-linux-0.1.0a2-alpha-amd64-iso-part-02 -D release-assets
      - name: Upload ISO part 02
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY" release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02 --clobber
      - name: Remove ISO part 02
        run: rm -rf release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-02

      - name: Download ISO part 03
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n alpha-linux-0.1.0a2-alpha-amd64-iso-part-03 -D release-assets
      - name: Upload ISO part 03
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY" release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03 --clobber
      - name: Remove ISO part 03
        run: rm -rf release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-03

      - name: Download ISO part 04
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n alpha-linux-0.1.0a2-alpha-amd64-iso-part-04 -D release-assets
      - name: Upload ISO part 04
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY" release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04 --clobber
      - name: Remove ISO part 04
        run: rm -rf release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.part-04

      - name: Download release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n alpha-linux-0.1.0a2-alpha-amd64-release-metadata -D release-assets

      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0a2 -R "$GITHUB_REPOSITORY" release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.sha256 release-assets/alpha-linux-0.1.0a2-alpha-amd64.iso.parts.json release-assets/REASSEMBLE-ISO.txt --clobber
