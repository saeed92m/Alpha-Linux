[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-linux-core"
version = "0.4.0"
description = "Foundational contracts and policy boundaries for Alpha Linux"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
dependencies = []

[project.scripts]
alpha-core = "alpha_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "coverage==7.16.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    "build==1.6.1",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["implementation"]

[tool.pytest.ini_options]
testpaths = ["implementation/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["implementation"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
